<!doctype html>
<!-- edit.mjs draws each frame of a take here: a crop of the 2x capture, scaled to the output size. -->
<html><head><meta charset="utf-8"><style>html, body { margin: 0; background: #000; } canvas { display: block; }</style></head>
<body><canvas></canvas>
<script>
const cv = document.querySelector('canvas'), g = cv.getContext('2d');
const cache = new Map();
function load(src) {
  if (!cache.has(src)) { const im = new Image(); im.src = src; cache.set(src, im.decode().then(() => im)); }
  if (cache.size > 12) cache.delete(cache.keys().next().value);
  return cache.get(src);
}
window.size = (w, h) => { cv.width = w; cv.height = h; };
/** layers: [[src, [sx, sy, sw, sh], alpha], ...] drawn in order */
window.draw = async (layers, preload = []) => {
  const ims = await Promise.all(layers.map(([src]) => load(src)));
  preload.forEach(load);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  layers.forEach(([, c, a], i) => { g.globalAlpha = a; g.drawImage(ims[i], ...c, 0, 0, cv.width, cv.height); });
  g.globalAlpha = 1;
};
</script></body></html>
