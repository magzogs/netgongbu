# Installers for the desktop app: `pnpm --filter @netgongbu/desktop dist` builds one for this OS,
# and .github/workflows/release.yml builds all three and publishes them to magzogs/netgongbu.
# Every dependency is bundled into out/ by electron-vite, so no node_modules ship with the app.
appId: com.magzog.netgongbu
productName: Net Gongbu
artifactName: NetGongbu-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**/*
npmRebuild: false
mac:
  target: dmg
  category: public.app-category.education
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Education
publish: null
