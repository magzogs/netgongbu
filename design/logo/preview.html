<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Net Gongbu logo concepts</title>
<style>
:root{--bg:#17100b;--panel:rgb(39 26 17/.86);--border:rgb(196 168 146/.18);--text:#f3e9df;--muted:#bfa48f;--accent:#ff9f1c;
font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;color:var(--text)}
body{margin:0;background:var(--bg);padding:24px}
h1{font-size:18px;margin:0 0 16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h2{font-size:14px;margin:0 0 4px}.card p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.sizes{display:flex;align-items:end;gap:14px;margin-bottom:14px}
.bar{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.bar b{font-size:15px;letter-spacing:.02em}.bar b span{color:var(--accent)}
.light{background:#f3e9df;border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;margin-top:10px}
</style></head><body>
<h1>Net Gongbu 로고 시안</h1>
<div class="row">
<div class="card"><h2>A · Node Cube (현재 로고 다듬기)</h2><p>지금 쓰는 노드 큐브에 패킷 경로(민트 선)를 그려 넣고 앱 아이콘 배경을 추가했습니다.</p>
<div class="sizes"><img src="a-node-cube.svg" width="128"><img src="a-node-cube.svg" width="48"><img src="a-node-cube.svg" width="28"><img src="a-node-cube.svg" width="16"></div>
<div class="bar"><img src="a-node-cube.svg" width="28"><b>Net <span>Gongbu</span></b></div>
<div class="light"><img src="a-node-cube.svg" width="40"><img src="a-node-cube.svg" width="20"></div></div>
<div class="card"><h2>B · Layer Stack</h2><p>계층 3장(응용·전송·링크)이 쌓인 아이소메트릭 블록에 패킷이 내려앉습니다. 캡슐화와 3D 화면을 함께 표현합니다.</p>
<div class="sizes"><img src="b-layer-stack.svg" width="128"><img src="b-layer-stack.svg" width="48"><img src="b-layer-stack.svg" width="28"><img src="b-layer-stack.svg" width="16"></div>
<div class="bar"><img src="b-layer-stack.svg" width="28"><b>Net <span>Gongbu</span></b></div>
<div class="light"><img src="b-layer-stack.svg" width="40"><img src="b-layer-stack.svg" width="20"></div></div>
<div class="card"><h2>C · 공(Gong) Route</h2><p>한글 ‘공’을 네트워크 경로로 그렸습니다. ㄱ·ㅗ는 장비를 잇는 선, ㅇ은 목적지, 민트 점은 이동 중인 패킷입니다.</p>
<div class="sizes"><img src="c-gong-route.svg" width="128"><img src="c-gong-route.svg" width="48"><img src="c-gong-route.svg" width="28"><img src="c-gong-route.svg" width="16"></div>
<div class="bar"><img src="c-gong-route.svg" width="28"><b>Net <span>Gongbu</span></b></div>
<div class="light"><img src="c-gong-route.svg" width="40"><img src="c-gong-route.svg" width="20"></div></div>
</div></body></html>
