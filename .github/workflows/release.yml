name: Release

# A version tag (v0.2.0, or v0.2.0-beta.1 for a pre-release) builds the desktop app for macOS,
# Windows and Linux and publishes the installers as a release of the public repo below. The
# source stays in this private repo; the public one only holds a README and the releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release again (e.g. v0.2.0); it must already exist here'
        required: true

permissions:
  contents: read

env:
  RELEASE_REPO: magzogs/netgongbu
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64 --x64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        shell: bash
        working-directory: apps/desktop
        env:
          # macOS: with a Developer ID certificate (base64 .p12) the app is signed, and with the
          # Apple ID secrets also notarized. Without them it is ad-hoc signed, which Gatekeeper
          # asks the learner to allow once (see the public README).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm build
          sign=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then sign=(-c.mac.identity=-); fi
          pnpm exec electron-builder ${{ matrix.target }} --publish never \
            -c.extraMetadata.version="${TAG#v}" "${sign[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish to ${{ env.RELEASE_REPO }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a RELEASES_TOKEN secret that can write to $RELEASE_REPO (see README, 릴리스)."
            exit 1
          fi
          # checkout leaves a lightweight tag; fetch the real one for its message.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes=$(git tag -l --format='%(contents)' "$TAG")
          [ -n "$notes" ] || notes="Net Gongbu ${TAG#v}"
          if gh release view "$TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --repo "$RELEASE_REPO" --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags=(--prerelease); fi
            gh release create "$TAG" installers/* --repo "$RELEASE_REPO" \
              --title "Net Gongbu ${TAG#v}" --notes "$notes" "${flags[@]}"
          fi
